[project]
name = "journal-api"
version = "0.1.0"
description = "A private journaling API built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.9",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
