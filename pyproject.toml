[project]
name = "journal-api"
version = "0.1.0"
description = "A private journaling API built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.10",
    "azure-storage-blob>=12.30.1",
    "fastapi[standard]>=0.140.9",
    "greenlet>=3.5.5",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
